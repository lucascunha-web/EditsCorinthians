<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco do Timão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div id="div1">
            <img src="img/corinthians.png" alt="Corinthians" id="corinthians">
            <h1>Elenco do Timão</h1>
        </div>
        <nav id="opcoes1">
            <a href="#goleiros" class="opcoes">Goleiros</a>
            <a href="#zagueiros" class="opcoes">Zagueiros</a>
            <a href="#meio-campo" class="opcoes">Meio Campo</a>
            <a href="#atacantes" class="opcoes">Atacantes</a>
        </nav>
    </header>
    <section class="container" id="goleiros">
        <h2>Goleiros</h2>
        <div class="container2">
            <div class="card">
                <h2>Hugo Souza</h2>
                <img src="https://cdn-img.staticzz.com/img/planteis/new/72/46/14167246_hugo_souza_20250505162035.png" alt="Hugo Souza" class="card-img">
            </div>
        </div>
    </section>
    <section class="container" id="zagueiros">
        <h2>Zagueiros</h2>
        <div class="container2">
            <div class="card">
                <h2>Gustavo Henrique</h2>
                <img src="https://cdn-img.staticzz.com/img/planteis/new/89/39/14308939_gustavo_henrique_20250501042838.png" alt="Gustavo Henrique" class="card-img">
            </div>
        </div>
    </section>
    <section class="container" id="meio-campo">
        <h2>Meio Campo</h2>
        <div class="container2">
            <div class="card">
                <h2>Rodrigo Garro</h2>
                <img src="https://cdn-img.staticzz.com/img/planteis/new/74/02/14277402_rodrigo_garro_20250501041435.png" alt="Rodrigo Garro" class="card-img">
            </div>
    </section>
    <section class="container" id="atacantes">
        <h2>Atacantes</h2>
        <div class="container2">
            <div class="card">
                <h2>Yuri Alberto</h2>
                <img src="https://www.ogol.com.br/img/jogadores/new/06/61/1130661_yuri_alberto_20240513114123.png" alt="Yuri Alberto" class="card-img">
            </div>
    </section>
</body>
</html>
